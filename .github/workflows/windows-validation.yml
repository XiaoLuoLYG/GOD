name: GOD native Windows validation

on:
  push:
    branches: ['luoyige/god-windows-validation-*']

permissions:
  contents: read

jobs:
  windows:
    name: ${{ matrix.label }}
    runs-on: windows-2025
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Combined / OpenAI compatible
            ref: edef2398fee3961788c14d7817b1e31533c62116
            mode: external
          - label: Combined / JiuwenSwarm migration
            ref: edef2398fee3961788c14d7817b1e31533c62116
            mode: migration
    steps:
      - name: Enable long Git paths
        run: git config --global core.longpaths true
      - name: Check out validation harness
        uses: actions/checkout@v6
        with:
          path: harness
          persist-credentials: false
          sparse-checkout: .github/windows-validation.py
          sparse-checkout-cone-mode: false
      - name: Check out exact source under test
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
          path: src
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Exercise god.cmd and god.ps1 on native Windows
        env:
          UV_PYTHON: '3.11'
          UV_NO_PROGRESS: '1'
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
          DO_NOT_TRACK: '1'
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or '${{ runner.environment }}' -ne 'github-hosted') {
            throw 'The PATH fixture is limited to disposable GitHub-hosted Windows machines.'
          }
          $originalMachinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $originalUserPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          try {
            $windows = $env:SystemRoot
            $systemPaths = "$windows\System32;$windows;$windows\System32\Wbem;$windows\System32\WindowsPowerShell\v1.0"
            [Environment]::SetEnvironmentVariable('Path', $systemPaths, 'Machine')
            [Environment]::SetEnvironmentVariable('Path', $null, 'User')
            Write-Host 'Using a short Machine/User PATH fixture for this disposable Windows runner.'
            python -u harness/.github/windows-validation.py src '${{ matrix.mode }}'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            [Environment]::SetEnvironmentVariable('Path', $originalMachinePath, 'Machine')
            [Environment]::SetEnvironmentVariable('Path', $originalUserPath, 'User')
          }
