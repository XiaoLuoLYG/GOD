<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">GOD accepted at EMNLP 2026</title>
  <desc id="desc">GOD was accepted to the EMNLP 2026 System Demonstrations track. Paper by Yige Luo and Ran Guan.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="0.55" stop-color="#eef9f5"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#3366a3"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#3366a3" stroke-opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#1a2d4a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="238" rx="24" fill="url(#background)" stroke="#d8e2ea" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="238" rx="24" fill="url(#grid)"/>
  <circle cx="1110" cy="-10" r="150" fill="#3366a3" fill-opacity="0.055"/>
  <circle cx="1040" cy="245" r="130" fill="#0f766e" fill-opacity="0.06"/>

  <g transform="translate(42 38)">
    <rect width="250" height="34" rx="17" fill="#ffffff" stroke="#0f766e" stroke-opacity="0.3"/>
    <circle cx="18" cy="17" r="6" fill="#d6a84b"/>
    <text x="34" y="22" fill="#0f766e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="800" letter-spacing="1.1">EMNLP 2026 · SYSTEM DEMOS</text>
  </g>

  <text x="42" y="126" fill="#142033" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="45" font-weight="850" letter-spacing="-1.2">GOD accepted at EMNLP 2026</text>
  <text x="43" y="163" fill="#46566e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="650">Govern · Observe · Direct — A Real-Time Control Room for Agent Societies</text>
  <text x="43" y="197" fill="#65738a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="650">Yige Luo · Ran Guan</text>

  <g transform="translate(928 82)" filter="url(#shadow)">
    <rect width="224" height="76" rx="18" fill="#142033"/>
    <text x="26" y="32" fill="#a7d8d2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="800" letter-spacing="1.35">CAMERA-READY</text>
    <text x="26" y="56" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="800">Read the paper</text>
    <circle cx="190" cy="38" r="18" fill="url(#accent)"/>
    <path d="M184 44l12-12m-8 0h8v8" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
